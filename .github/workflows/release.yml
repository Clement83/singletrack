name: Release

# Releases are cut by a release (MEP) ticket, not by a bot (#1670): the maintainer bumps `package.json`, writes the
# `## [X.Y.Z]` section of CHANGELOG.md, then pushes the `vX.Y.Z` tag. This workflow turns that tag into a GitHub
# Release whose notes are that CHANGELOG section. The same tag triggers images.yml (X.Y.Z / X.Y / latest images).
# Replaces release-please (#1485), whose release PRs could not be opened with the default GITHUB_TOKEN.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match package.json version $pkg"
            exit 1
          fi
      - name: Extract the release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::No '## [$version]' section in CHANGELOG.md"
            exit 1
          fi
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
