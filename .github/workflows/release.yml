name: Release

# Versions semver (#1485) : release-please tient une PR « chore(main): release X.Y.Z » à jour (bump de package.json,
# CHANGELOG.md depuis les commits conventionnels feat|fix|chore). La fusionner crée le tag vX.Y.Z et la GitHub Release,
# et le tag déclenche images.yml (images X.Y.Z / X.Y / latest, #1483).
# NB : un tag créé avec GITHUB_TOKEN ne déclenche pas d'autre workflow. Pour que images.yml parte tout seul, créer le
# secret RELEASE_PLEASE_TOKEN (PAT ou GitHub App, droits contents + pull-requests) ; sans lui, relancer images.yml à la main.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
