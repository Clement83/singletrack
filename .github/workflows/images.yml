name: Images

# Publishes the multi-arch images to GHCR (#1483): `edge` on every push to main, X.Y.Z / X.Y / latest on a vX.Y.Z tag.
# Never from a pull request (no pull_request trigger); only GITHUB_TOKEN is used.
#
# Speed (#1673): each architecture builds on a native runner (no QEMU emulation), pushes by digest, then a merge job
# assembles the multi-arch manifests. `singletrack` (target release) and `singletrack-tools` (target runner) build in
# the same job so the second one reuses the `builder` stage.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  OWNER: clement83

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: app
        name: singletrack (target release)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: release
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.title=singletrack
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.OWNER }}/singletrack,push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true
          cache-from: type=gha,scope=app-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.arch }}

      # Same builder instance and same build cache as the step above: the `builder` stage is not rebuilt.
      - id: tools
        name: singletrack-tools (target runner)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: runner
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.title=singletrack-tools
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.OWNER }}/singletrack-tools,push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true
          cache-from: type=gha,scope=app-${{ matrix.arch }}

      - id: brouter
        name: singletrack-brouter
        uses: docker/build-push-action@v7
        with:
          context: brouter
          file: brouter/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.title=singletrack-brouter
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.OWNER }}/singletrack-brouter,push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true
          cache-from: type=gha,scope=brouter-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=brouter-${{ matrix.arch }}

      - name: Export digests
        env:
          APP: ${{ steps.app.outputs.digest }}
          TOOLS: ${{ steps.tools.outputs.digest }}
          BROUTER: ${{ steps.brouter.outputs.digest }}
        run: |
          mkdir -p digests
          echo "$APP" > digests/singletrack
          echo "$TOOLS" > digests/singletrack-tools
          echo "$BROUTER" > digests/singletrack-brouter
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: publish ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [singletrack, singletrack-tools, singletrack-brouter]
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Create the multi-arch manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          NAME: ${{ matrix.image }}
        run: |
          sources=()
          for arch in amd64 arm64; do
            sources+=("$IMAGE@$(cat "digests/digests-$arch/$NAME")")
          done
          tags=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tags+=(-t "$tag")
          done <<< "$DOCKER_METADATA_OUTPUT_TAGS"
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
      - name: Inspect
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"
