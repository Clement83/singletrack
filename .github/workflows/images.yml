name: Images

# Publie les images multi-architecture sur GHCR (#1483) : `edge` à chaque push sur main, X.Y.Z / X.Y / latest sur un tag vX.Y.Z.
# Jamais depuis une pull request (pas de déclencheur pull_request) ; seul GITHUB_TOKEN est utilisé.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: singletrack
            context: .
            file: Dockerfile
            target: release
          # Outils ponctuels du compose de distribution (#1484) : synchros de traces, création de compte.
          - name: singletrack-tools
            context: .
            file: Dockerfile
            target: runner
          - name: singletrack-brouter
            context: brouter
            file: brouter/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/clement83/${{ matrix.image.name }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.title=${{ matrix.image.name }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
