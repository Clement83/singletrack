name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, tokens, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags nécessaires au test de montée de version
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # .npmrc (legacy-peer-deps) est lu automatiquement.
      - run: npm ci
      # Montée de version (#1485) : base de la version précédente (dernier tag) + migrations courantes ; migrations publiées intactes.
      - run: ./scripts/upgrade-test.sh
      - run: npm run lint
      - run: npx tsc --noEmit
      # Couverture + seuils (vitest.config.ts, #1482) : échoue si la couverture régresse sous les seuils.
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
      - run: npm run tokens:check
      # Build de production : attrape les erreurs serveur → client qui n'apparaissent qu'au build (#1464).
      - run: npm run build

  docker:
    name: Image Docker (runner, sans push)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          push: false
          load: true
          tags: singletrack:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Test de fumée (#1482) : l'image démarre sur une base d'exemple, /api/health, /login FR/EN, /t/<slug> publique.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: SMOKE_IMAGE=singletrack:ci ./scripts/smoke-docker.sh

  # Test d'installation (#1484) : compose.yml de distribution + init-env.sh sur des images fraîchement construites.
  install:
    name: Test d'installation (compose de distribution)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: release
          load: true
          tags: local/singletrack:ci
          cache-from: type=gha,scope=install-app
          cache-to: type=gha,mode=max,scope=install-app
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          load: true
          tags: local/singletrack-tools:ci
          cache-from: type=gha
      - uses: docker/build-push-action@v7
        with:
          context: brouter
          load: true
          tags: local/singletrack-brouter:ci
      - run: SINGLETRACK_REGISTRY=local SINGLETRACK_TAG=ci ./scripts/install-test.sh
