name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, tokens, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags needed by the upgrade test
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # .npmrc (legacy-peer-deps) is read automatically.
      - run: npm ci
      # Upgrade test (#1485): database from the previous version (last tag) + current migrations; published migrations untouched.
      - run: ./scripts/upgrade-test.sh
      - run: npm run lint
      - run: npx tsc --noEmit
      # Coverage + thresholds (vitest.config.ts, #1482): fails if coverage drops below the thresholds.
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
      - run: npm run tokens:check
      # Production build: catches server → client errors that only show up at build time (#1464).
      - run: npm run build

  docker:
    name: Image Docker (runner, sans push)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          push: false
          load: true
          tags: singletrack:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Smoke test (#1482): the image starts on a sample database, /api/health, /login FR/EN, public /t/<slug> redirect.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: SMOKE_IMAGE=singletrack:ci ./scripts/smoke-docker.sh

  # Install test (#1484): distribution compose.yml + init-env.sh on freshly built images.
  install:
    name: Test d'installation (compose de distribution)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: release
          load: true
          tags: local/singletrack:ci
          cache-from: type=gha,scope=install-app
          cache-to: type=gha,mode=max,scope=install-app
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          load: true
          tags: local/singletrack-tools:ci
          cache-from: type=gha
      - uses: docker/build-push-action@v7
        with:
          context: brouter
          load: true
          tags: local/singletrack-brouter:ci
      - run: SINGLETRACK_REGISTRY=local SINGLETRACK_TAG=ci ./scripts/install-test.sh
