# Singletrack — DISTRIBUTION compose file (#1484). Images published on GHCR, no `build:`.
# (The repository's `docker-compose.yml` is the development compose file: mounted code, `next dev`.)
#
# Quick start: README.md · full guide: docs/install.md
#   ./scripts/init-env.sh https://mtb.example.org   # creates .env + secrets + ./data
#   docker compose up -d
#
# Variables read from .env (compose interpolation): APP_PORT, APP_UID/APP_GID, BROUTER_TILES, SINGLETRACK_TAG.
name: singletrack

services:
  app:
    image: ${SINGLETRACK_REGISTRY:-ghcr.io/clement83}/singletrack:${SINGLETRACK_TAG:-latest}
    restart: unless-stopped
    # Same user as the owner of ./data: the database and photos stay readable and easy to back up.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file: .env
    environment:
      DATABASE_URL: /app/data/singletrack.db
      BROUTER_URL: http://brouter:17777
    ports:
      - "${APP_PORT:-3700}:3000"
    volumes:
      - ./data:/app/data
    # No dependency on BROUTER: without tiles, snapping fails cleanly and the editor falls back to straight lines.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Downloads the BRouter tiles of BROUTER_TILES on first start only (tiles already present are
  # kept), then stops. A network failure does not prevent start-up: run `docker compose up -d` again.
  brouter-init:
    image: ${SINGLETRACK_REGISTRY:-ghcr.io/clement83}/singletrack-brouter:${SINGLETRACK_TAG:-latest}
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    restart: "no"
    entrypoint: ["/brouter/fetch-segments.sh"]
    environment:
      BROUTER_TILES: ${BROUTER_TILES:-france}
      HOME_LAT: ${HOME_LAT:-46.6}
      HOME_LON: ${HOME_LON:-2.4}
    volumes:
      - ./data/brouter/segments:/segments

  # Mountain-bike routing engine: only called by `app`, no published port.
  brouter:
    image: ${SINGLETRACK_REGISTRY:-ghcr.io/clement83}/singletrack-brouter:${SINGLETRACK_TAG:-latest}
    restart: unless-stopped
    depends_on:
      brouter-init:
        condition: service_completed_successfully
    volumes:
      - ./data/brouter/segments:/segments:ro
    healthcheck:
      # The server answers (even without tiles): it returns 400 to an empty request, hence no `-f`.
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:17777/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # One-off tools (track syncs, account creation), outside the normal start-up:
  #   docker compose run --rm tools npm run sync:osm -- 83
  tools:
    profiles: ["tools"]
    image: ${SINGLETRACK_REGISTRY:-ghcr.io/clement83}/singletrack-tools:${SINGLETRACK_TAG:-latest}
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file: .env
    environment:
      DATABASE_URL: /app/data/singletrack.db
      BROUTER_URL: http://brouter:17777
      HOME: /tmp
    volumes:
      - ./data:/app/data
