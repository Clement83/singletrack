name: singletrack
services:
  # Production (#1670) : image publiée par la CI (GHCR), aucune construction locale. La version est épinglée par
  # SINGLETRACK_TAG dans .env (`edge` = dernier push sur main, `X.Y.Z` = release) ; seul un ticket de MEP la change.
  #   docker compose -f docker-compose.yml pull app brouter && docker compose -f docker-compose.yml up -d app brouter
  app:
    image: ${SINGLETRACK_REGISTRY:-ghcr.io/clement83}/singletrack:${SINGLETRACK_TAG:-latest}
    # Même utilisateur que le propriétaire de ./data (base, photos, sauvegardes).
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    restart: unless-stopped
    # Réseau bridge par défaut (sur un hôte au pool d'adresses compose saturé, un réseau dédié est impossible).
    # Sur une installation normale, retirer `network_mode` (et `links`) : compose crée son réseau et le DNS interne.
    network_mode: bridge
    env_file: .env
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      DATABASE_URL: /app/data/singletrack.db
      BROUTER_URL: http://brouter:17777
    ports:
      - "${APP_PORT:-3700}:3000"
    volumes:
      - ./data:/app/data
    # Réseau bridge par défaut (pas de DNS) : `links` rend `brouter` résolvable depuis `app`.
    links:
      - brouter
    depends_on:
      brouter:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Serveur de développement ponctuel (#1644) : `next dev`, code monté, rechargement à chaud, LAN seulement.
  #   docker compose -f docker-compose.yml --profile dev up -d app-dev   → port APP_DEV_PORT (3701) ; puis `docker compose stop app-dev`.
  # Base jetable `data/dev.db`, recopiée depuis `singletrack.db` à chaque lancement (jamais la base de prod).
  # Fédération coupée (sinon la file d'envoi partagée `data/federation.db` livrerait depuis la copie).
  app-dev:
    profiles: [dev]
    build:
      context: .
      target: dev
    image: singletrack-app-dev
    restart: "no"
    network_mode: bridge
    env_file: .env
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NODE_ENV: development
      DATABASE_URL: /app/data/dev.db
      FEDERATION: "off"
      BROUTER_URL: http://brouter:17777
    ports:
      - "${APP_DEV_PORT:-3701}:3000"
    volumes:
      - .:/app
      # node_modules et cache .next propres au conteneur (binaire better-sqlite3 de l'image, pas de conflit avec l'hôte).
      - node_modules:/app/node_modules
      - next_cache_dev:/app/.next
    links:
      - brouter
    depends_on:
      brouter:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        rm -f /app/data/dev.db /app/data/dev.db-wal /app/data/dev.db-shm
        node -e "const D=require('better-sqlite3');new D('/app/data/singletrack.db').backup('/app/data/dev.db').then(()=>process.exit(0))"
        exec npm run dev
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  # Moteur de routage VTT (#1340) : appelé uniquement par `app`, aucun port publié. Image publiée (#1670), même tag que `app`.
  brouter:
    image: ${SINGLETRACK_REGISTRY:-ghcr.io/clement83}/singletrack-brouter:${SINGLETRACK_TAG:-latest}
    restart: unless-stopped
    network_mode: bridge
    volumes:
      - ./data/brouter/segments:/segments:ro
    healthcheck:
      # Itinéraire test autour du point maison (HOME_LON/HOME_LAT du .env) : il faut donc que sa tuile soit téléchargée.
      test: ["CMD-SHELL", "E=$$(awk 'BEGIN{print ${HOME_LON:-2.4}+0.01}'); for p in singletrack singletrack-vae; do curl -sf \"http://localhost:17777/brouter?lonlats=${HOME_LON:-2.4},${HOME_LAT:-46.6}|$$E,${HOME_LAT:-46.6}&profile=$$p&alternativeidx=0&format=geojson\" >/dev/null || exit 1; done"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Outils ponctuels (#1670 : l'image de prod n'a ni sources ni devDependencies) : synchros, comptes, recalculs.
  #   docker compose -f docker-compose.yml run --rm tools npm run sync:osm -- 83
  tools:
    profiles: [tools]
    image: ${SINGLETRACK_REGISTRY:-ghcr.io/clement83}/singletrack-tools:${SINGLETRACK_TAG:-latest}
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    network_mode: bridge
    env_file: .env
    environment:
      DATABASE_URL: /app/data/singletrack.db
      BROUTER_URL: http://brouter:17777
      HOME: /tmp
    volumes:
      - ./data:/app/data
    links:
      - brouter

  # Serveur de l'app pour les tests e2e : build de production (`next dev` recharge la page en boucle sous Playwright, HMR + base SQLite surveillée).
  # Dossier de build `.next-build` (ignoré par git), même base et même BRouter que `app`.
  app-e2e:
    profiles: [e2e]
    image: singletrack-app-dev
    network_mode: bridge
    env_file: .env
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      NEXT_DIST_DIR: .next-build
      DATABASE_URL: /app/data/singletrack.db
      BROUTER_URL: http://brouter:17777
    links:
      - brouter
    depends_on:
      brouter:
        condition: service_healthy
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: ["sh", "-c", "npx next build && npx next start -p 3000 -H 0.0.0.0"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 240s

  # Tests de bout en bout (#1523) : jamais lancés par défaut (profil `e2e`).
  #   docker compose -f docker-compose.yml --profile e2e run --rm e2e
  # Session de test : compte `e2e@singletrack.test` + cookie de session posés en base (aucun vrai mail), écrits dans e2e/.auth/.
  e2e-session:
    profiles: [e2e]
    # Image de dev (devDependencies, tsx) : `docker compose --profile dev build app-dev`.
    image: singletrack-app-dev
    network_mode: bridge
    env_file: .env
    environment:
      DATABASE_URL: /app/data/singletrack.db
      E2E_BASE_URL: http://app-e2e:3000
      NODE_ENV: development
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache_dev:/app/.next
    command: ["npx", "tsx", "scripts/e2e-session.ts"]

  # Playwright (Chromium) dans l'image officielle, version identique à e2e/package.json. Vise l'app du conteneur `app`.
  e2e:
    profiles: [e2e]
    image: mcr.microsoft.com/playwright:v1.56.1-noble
    network_mode: bridge
    ipc: host
    working_dir: /work
    environment:
      E2E_BASE_URL: http://app-e2e:3000
      CI: "1"
    links:
      - app-e2e
    depends_on:
      app-e2e:
        condition: service_healthy
      e2e-session:
        condition: service_completed_successfully
    volumes:
      - ./e2e:/work
      - e2e_node_modules:/work/node_modules
      - e2e_results:/results
    command: ["sh", "-c", "npm install --no-audit --no-fund --no-package-lock --loglevel=error && npx playwright test \"$$@\"", "--"]

volumes:
  e2e_node_modules:
  e2e_results:
  node_modules:
  next_cache_dev:
