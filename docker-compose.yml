name: singletrack
services:
  # Production (#1670): image published by CI (GHCR), nothing built locally. The version is pinned by
  # SINGLETRACK_TAG in .env (`edge` = latest push to main, `X.Y.Z` = release); only a release ticket changes it.
  #   docker compose -f docker-compose.yml pull app brouter && docker compose -f docker-compose.yml up -d app brouter
  app:
    image: ${SINGLETRACK_REGISTRY:-ghcr.io/clement83}/singletrack:${SINGLETRACK_TAG:-latest}
    # Same user as the owner of ./data (database, photos, backups).
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    restart: unless-stopped
    # Default bridge network (on a host whose compose address pool is exhausted, a dedicated network is impossible).
    # On a normal install, remove `network_mode` (and `links`): compose creates its network and internal DNS.
    network_mode: bridge
    env_file: .env
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      DATABASE_URL: /app/data/singletrack.db
      BROUTER_URL: http://brouter:17777
    ports:
      - "${APP_PORT:-3700}:3000"
    volumes:
      - ./data:/app/data
      # Outing media (photos, videos) on the host's media disk (#1695); MEDIA_DIR=/app/media in .env.
      - /home/clement/media/library/media/singletrack:/app/media
    # Short videos (#1693): Intel iGPU (QSV) for the conversion, shared with other services of the host; the
    # container user joins the host's `render` group (RENDER_GID). Without /dev/dri the app falls back to libx264.
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-109}"
    # Default bridge network (no DNS): `links` makes `brouter` resolvable from `app`.
    links:
      - brouter
    depends_on:
      brouter:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # One-off development server (#1644): `next dev`, mounted code, hot reload, LAN only.
  #   docker compose -f docker-compose.yml --profile dev up -d app-dev   → port APP_DEV_PORT (3701); then `docker compose stop app-dev`.
  # Throwaway database `data/dev.db`, copied from `singletrack.db` on every start (never the production database).
  # Federation off (otherwise the shared delivery queue `data/federation.db` would deliver from the copy).
  app-dev:
    profiles: [dev]
    build:
      context: .
      target: dev
    image: singletrack-app-dev
    restart: "no"
    network_mode: bridge
    env_file: .env
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NODE_ENV: development
      DATABASE_URL: /app/data/dev.db
      FEDERATION: "off"
      BROUTER_URL: http://brouter:17777
    ports:
      - "${APP_DEV_PORT:-3701}:3000"
    # Same iGPU access as `app` (#1693).
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-109}"
    volumes:
      - .:/app
      # node_modules and .next cache owned by the container (better-sqlite3 binary from the image, no clash with the host).
      - node_modules:/app/node_modules
      - next_cache_dev:/app/.next
    links:
      - brouter
    depends_on:
      brouter:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        rm -f /app/data/dev.db /app/data/dev.db-wal /app/data/dev.db-shm
        node -e "const D=require('better-sqlite3');new D('/app/data/singletrack.db').backup('/app/data/dev.db').then(()=>process.exit(0))"
        exec npm run dev
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  # Mountain-bike routing engine (#1340): only called by `app`, no published port. Published image (#1670), same tag as `app`.
  brouter:
    image: ${SINGLETRACK_REGISTRY:-ghcr.io/clement83}/singletrack-brouter:${SINGLETRACK_TAG:-latest}
    restart: unless-stopped
    network_mode: bridge
    volumes:
      - ./data/brouter/segments:/segments:ro
    healthcheck:
      # Test route around the home point (HOME_LON/HOME_LAT from .env): its tile must therefore be downloaded.
      test: ["CMD-SHELL", "E=$$(awk 'BEGIN{print ${HOME_LON:-2.4}+0.01}'); for p in singletrack singletrack-vae; do curl -sf \"http://localhost:17777/brouter?lonlats=${HOME_LON:-2.4},${HOME_LAT:-46.6}|$$E,${HOME_LAT:-46.6}&profile=$$p&alternativeidx=0&format=geojson\" >/dev/null || exit 1; done"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # One-off tools (#1670: the production image has no sources or devDependencies): syncs, accounts, recomputations.
  #   docker compose -f docker-compose.yml run --rm tools npm run sync:osm -- 83
  # Offline pack worker (#1749): runs the builds/refreshes queued from /admin/offline, one at a time (tools image: pmtiles CLI).
  offline-worker:
    image: ${SINGLETRACK_REGISTRY:-ghcr.io/clement83}/singletrack-tools:${SINGLETRACK_TAG:-latest}
    command: ["node", "node_modules/.bin/tsx", "scripts/offline-worker.ts"]  # direct: npm run does not forward SIGTERM
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    network_mode: bridge
    env_file: .env
    environment:
      DATABASE_URL: /app/data/singletrack.db
      HOME: /tmp
    volumes:
      - ./data:/app/data

  tools:
    profiles: [tools]
    image: ${SINGLETRACK_REGISTRY:-ghcr.io/clement83}/singletrack-tools:${SINGLETRACK_TAG:-latest}
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    network_mode: bridge
    env_file: .env
    environment:
      DATABASE_URL: /app/data/singletrack.db
      BROUTER_URL: http://brouter:17777
      HOME: /tmp
    volumes:
      - ./data:/app/data
    links:
      - brouter

  # App server for the e2e tests: production build (`next dev` reloads the page in a loop under Playwright, HMR + watched SQLite database).
  # Build folder `.next-build` (ignored by git), same database and same BRouter as `app`.
  app-e2e:
    profiles: [e2e]
    image: singletrack-app-dev
    network_mode: bridge
    env_file: .env
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      NEXT_DIST_DIR: .next-build
      DATABASE_URL: /app/data/singletrack.db
      BROUTER_URL: http://brouter:17777
    links:
      - brouter
    depends_on:
      brouter:
        condition: service_healthy
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: ["sh", "-c", "npx next build && npx next start -p 3000 -H 0.0.0.0"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 240s

  # End-to-end tests (#1523): never started by default (`e2e` profile).
  #   docker compose -f docker-compose.yml --profile e2e run --rm e2e
  # Test session: account `e2e@singletrack.test` + session cookie written to the database (no real email), saved in e2e/.auth/.
  e2e-session:
    profiles: [e2e]
    # Development image (devDependencies, tsx): `docker compose --profile dev build app-dev`.
    image: singletrack-app-dev
    network_mode: bridge
    env_file: .env
    environment:
      DATABASE_URL: /app/data/singletrack.db
      E2E_BASE_URL: http://app-e2e:3000
      NODE_ENV: development
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache_dev:/app/.next
    command: ["npx", "tsx", "scripts/e2e-session.ts"]

  # Playwright (Chromium) in the official image, same version as e2e/package.json. Targets the `app-e2e` container.
  e2e:
    profiles: [e2e]
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    network_mode: bridge
    ipc: host
    working_dir: /work
    environment:
      E2E_BASE_URL: http://app-e2e:3000
      CI: "1"
    links:
      - app-e2e
    depends_on:
      app-e2e:
        condition: service_healthy
      e2e-session:
        condition: service_completed_successfully
    volumes:
      - ./e2e:/work
      - e2e_node_modules:/work/node_modules
      - e2e_results:/results
    command: ["sh", "-c", "npm install --no-audit --no-fund --no-package-lock --loglevel=error && npx playwright test \"$$@\"", "--"]

volumes:
  e2e_node_modules:
  e2e_results:
  node_modules:
  next_cache_dev:
